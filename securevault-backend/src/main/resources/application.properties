# Server Configuration
server.port=${PORT:8080}

# Database Configuration (Defaults to embedded H2 file database if no external SPRING_DATASOURCE_URL is provided)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/securevaultdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=INFO

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:SecureVaultSuperSecretKeyForJWTTokens256BitsMinimumHere!}
securevault.token.expiry-ms=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


